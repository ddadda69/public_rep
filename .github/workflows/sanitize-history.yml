name: One-time sanitize commit emails

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/sanitize-history.yml"]

permissions:
  contents: write
  actions: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Rewrite public branch and tag history
        shell: bash
        env:
          NEW_EMAIL: 18347182+ddadda69@users.noreply.github.com
        run: |
          set -euo pipefail

          git fetch --prune origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*'

          git checkout --detach "$GITHUB_SHA"

          git for-each-ref \
            --format='%(refname:strip=3)%09%(objectname)' \
            refs/remotes/origin \
            | grep -v $'^HEAD\\t' > /tmp/branch-leases.tsv || true

          while IFS=$'\t' read -r branch sha; do
            [ -n "$branch" ] || continue
            git branch -f "$branch" "$sha"
          done < /tmp/branch-leases.tsv

          git for-each-ref \
            --format='%(refname:strip=2)%09%(objectname)' \
            refs/tags > /tmp/tag-leases.tsv

          mapfile -t refs < <(
            git for-each-ref --format='%(refname)' refs/heads refs/tags
          )

          FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch -f \
            --tag-name-filter cat \
            --env-filter '
              if [ "$GIT_AUTHOR_NAME" = "ddadda69" ]; then
                GIT_AUTHOR_EMAIL="$NEW_EMAIL"
              fi
              if [ "$GIT_COMMITTER_NAME" = "ddadda69" ]; then
                GIT_COMMITTER_EMAIL="$NEW_EMAIL"
              fi
              export GIT_AUTHOR_EMAIL GIT_COMMITTER_EMAIL
            ' \
            -- "${refs[@]}"

          git for-each-ref --format='%(refname)' refs/original/ \
            | xargs -r -n1 git update-ref -d

          git checkout main
          git config user.name "ddadda69"
          git config user.email "$NEW_EMAIL"
          git rm .github/workflows/sanitize-history.yml
          git commit -m "chore: remove one-time history sanitizer"

          bad=0
          while IFS= read -r ref; do
            while IFS=$'\t' read -r an ae cn ce; do
              if [ "$an" = "ddadda69" ] && [ "$ae" != "$NEW_EMAIL" ]; then
                echo "::error::Unsanitized author email remains in $ref"
                bad=1
              fi
              if [ "$cn" = "ddadda69" ] && [ "$ce" != "$NEW_EMAIL" ]; then
                echo "::error::Unsanitized committer email remains in $ref"
                bad=1
              fi
            done < <(git log "$ref" --format='%an%x09%ae%x09%cn%x09%ce')
          done < <(git for-each-ref --format='%(refname)' refs/heads refs/tags)

          [ "$bad" -eq 0 ]

          while IFS=$'\t' read -r branch old_sha; do
            [ -n "$branch" ] || continue
            git push origin \
              "refs/heads/$branch:refs/heads/$branch" \
              --force-with-lease="refs/heads/$branch:$old_sha"
          done < /tmp/branch-leases.tsv

          while IFS=$'\t' read -r tag old_sha; do
            [ -n "$tag" ] || continue
            git push origin \
              "refs/tags/$tag:refs/tags/$tag" \
              --force-with-lease="refs/tags/$tag:$old_sha"
          done < /tmp/tag-leases.tsv

          echo "Rewritten refs:"
          git for-each-ref --format='%(refname:short) %(objectname)' refs/heads refs/tags
